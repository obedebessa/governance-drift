apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cross-payments
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://git-server.cross-system.svc.cluster.local/repo.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
