apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lab
  namespace: flux-system
spec:
  interval: 5m
  url: http://govdrift-git:8000/cgi-bin/git/remote.git
  ref:
    branch: master
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 10s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: lab
  path: ./payments
  prune: true
  wait: true
