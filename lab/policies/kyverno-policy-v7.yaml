# Policy version pi-7: the baseline under which the workload is admitted.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: governance-baseline
  labels: { policy-version: pi-7 }
spec:
  validationFailureAction: Audit
  rules:
    - name: require-prod-env-label
      match: { any: [ { resources: { kinds: [Deployment] } } ] }
      validate:
        message: "env label required by pi-7"
        pattern: { metadata: { labels: { env: "prod" } } }
